[package]
name = "opendoc-cli"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Offline docset search and browsing from the terminal for OpenDoc"
repository = "https://github.com/daidarzzz/opendoc-cli"
readme = "README.md"

[[bin]]
name = "opendoc-cli"
path = "src/main.rs"

[dependencies]
# Núcleo compartido con la app: mismo escaneo, índices, tarix y búsqueda.
opendoc-core = { git = "https://github.com/daidarzzz/opendoc-core", tag = "v0.1.1" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstyle = "1"
anstream = "0.6"
dirs = "6"

[dev-dependencies]
tempfile = "3"

# Binario pequeño para distribuir en las releases: prioriza el tamaño.
[profile.release]
opt-level = "z"     # optimiza por tamaño
lto = true          # enlazado con optimización global
codegen-units = 1   # más optimización (compilación algo más lenta)
panic = "abort"     # sin tablas de desenrollado
strip = true        # sin símbolos ni metadatos de depuración
