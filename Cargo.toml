[package]
name = "opendoc-cli"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Search, read, and manage OpenDoc docsets from the terminal"
repository = "https://github.com/daidarzzz/opendoc-cli"
readme = "README.md"
default-run = "odc"

[dependencies]
# Shared scanner, indexes, tarix support, and search.
opendoc-core = { git = "https://github.com/daidarzzz/opendoc-core", tag = "v0.2.0" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstyle = "1"
anstream = "0.6"
dirs = "6"
inquire = { version = "0.7", default-features = false, features = ["crossterm"] }
ratatui = "0.29"
crossterm = "0.28"
scraper = "0.22"
html2text = "0.17"
syntect = "5.3"
arboard = "3"
unicode-width = "0.2"
ego-tree = "0.10"
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tempfile = "3"
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Optimize release binaries for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
